<!doctype html>
<html lang="id" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{TITLE}} — Pedoman TA IF ITERA</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
    {{EXTRA_HEAD}}
  </head>
  <body>
    <nav class="topbar">
      <a href="index.html" class="topbar-brand">
        <svg
          width="24"
          height="24"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z" />
          <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z" />
        </svg>
        <span>Pedoman TA IF</span>
      </a>
      <div class="topbar-actions">
        <a href="index.html" class="topbar-link {{ACTIVE_HOME}}">Beranda</a>
        <a href="pedoman.html" class="topbar-link {{ACTIVE_PEDOMAN}}"
          >Pedoman</a
        >
        <a href="sosialisasi.html" class="topbar-link {{ACTIVE_SOSIALISASI}}"
          >Sosialisasi</a
        >
        <a href="formulir.html" class="topbar-link {{ACTIVE_FORMULIR}}"
          >Formulir</a
        >
        <a href="changelog.html" class="topbar-link {{ACTIVE_CHANGELOG}}"
          >Changelog</a
        >
        <div class="topbar-search" id="topbar-search" {{SEARCH_DISPLAY}}>
          <svg
            class="search-icon"
            width="14"
            height="14"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="11" cy="11" r="8" />
            <path d="m21 21-4.35-4.35" />
          </svg>
          <input
            type="text"
            id="pedoman-search"
            placeholder="Cari..."
            aria-label="Cari di pedoman"
            autocomplete="off"
            spellcheck="false"
          />
          <button
            class="search-clear"
            id="search-clear"
            aria-label="Hapus pencarian"
            hidden
          >
            ✕
          </button>
          <div class="search-results" id="search-results" hidden></div>
        </div>
        <button
          id="theme-toggle"
          class="theme-toggle"
          aria-label="Toggle dark mode"
        >
          <svg
            class="icon-sun"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <circle cx="12" cy="12" r="5" />
            <path
              d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"
            />
          </svg>
          <svg
            class="icon-moon"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
          >
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z" />
          </svg>
        </button>
      </div>
    </nav>
    {{BODY}}
    <script src="script.js"></script>
  </body>
</html>
